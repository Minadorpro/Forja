<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forja Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: barra lateral fija + área de trabajo en tarjetas; en móvil, barra inferior de pestañas. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#0F1521; --muted:#677083; --line:#E2E5EA; --track:#ECEEF2;
  --accent:#FF4A1C; --accent-ink:#FFFFFF; --accent-soft:#FFE9E2;
  --food:#0E9F6E; --food-soft:#DDF5EC;
  --goal:#2F5BFF; --goal-soft:#E3E9FF;
  --warn:#D97706; --bad:#DC2626;
  --side:#0F1521; --side-ink:#C9CFDA; --side-muted:#7A8496;
  --shadow:0 1px 2px rgba(15,21,33,.06),0 4px 16px rgba(15,21,33,.05);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F16; --surface:#141A23; --surface-2:#19202B; --ink:#E9EDF3; --muted:#8C96A8; --line:#242C38; --track:#222A36;
    --accent:#FF6A40; --accent-soft:#3A1F17; --food:#2CC48E; --food-soft:#12302A; --goal:#6F8DFF; --goal-soft:#1B2445;
    --side:#080B10; --side-ink:#C9CFDA; --side-muted:#6D7789;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0F16; --surface:#141A23; --surface-2:#19202B; --ink:#E9EDF3; --muted:#8C96A8; --line:#242C38; --track:#222A36;
  --accent:#FF6A40; --accent-soft:#3A1F17; --food:#2CC48E; --food-soft:#12302A; --goal:#6F8DFF; --goal-soft:#1B2445;
  --side:#080B10; --side-ink:#C9CFDA; --side-muted:#6D7789;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:500 14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num,.tab{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand-name{font:700 24px/1 var(--display);letter-spacing:.06em;color:#fff;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-ink);text-decoration:none;font-weight:600}
.nav a svg{width:19px;height:19px;flex:none;opacity:.8}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.1);color:#fff}
.nav a.on svg{color:var(--accent);opacity:1}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px;font-size:12px;color:var(--side-muted)}
.sync{display:flex;align-items:center;gap:8px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--side-muted);flex:none}
.sync.ok i{background:#2CC48E}.sync.saving i{background:#F5B83D}.sync.error i{background:#F05252}

.main{padding:28px clamp(20px,2.4vw,48px) 48px;min-width:0;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.title{font:700 38px/1.05 var(--display);letter-spacing:.01em;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.food{background:var(--food);border-color:var(--food);color:#fff}
.btn.goal{background:var(--goal);border-color:var(--goal);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn svg{width:16px;height:16px}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
:focus-visible{outline:2px solid var(--goal);outline-offset:2px}

.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-h h3{font:700 19px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.card-h .sub{color:var(--muted);font-size:12px;font-weight:600}
.stack{display:flex;flex-direction:column;gap:12px}

.kpi{display:flex;align-items:center;gap:16px;min-height:112px}
.kpi .k-label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .k-val{font:700 40px/1 var(--display);margin:4px 0 2px}
.kpi .k-val small{font-size:20px;color:var(--muted);font-weight:600;margin-left:3px}
.kpi .k-sub{font-size:12.5px;color:var(--muted);font-weight:600}
.ring-wrap{position:relative;flex:none;display:grid;place-items:center}
.ring-wrap span{position:absolute;font:700 18px/1 var(--display)}
.up{color:var(--food)}.down{color:var(--accent)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.food{background:var(--food-soft);color:var(--food);border-color:transparent}
.chip.goal{background:var(--goal-soft);color:var(--goal);border-color:transparent}
.chip.done{background:var(--food);color:#fff;border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.macro{display:grid;grid-template-columns:96px 1fr 92px;align-items:center;gap:12px;font-size:13px;font-weight:600}
.macro .v{text-align:right;color:var(--muted)}
.macro .v b{color:var(--ink)}

.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .s{font-size:12.5px;color:var(--muted);font-weight:600}
.empty{padding:22px;text-align:center;color:var(--muted);font-weight:600;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}

/* Semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wd{border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface-2);cursor:pointer}
.wd.today{border-color:var(--accent);background:var(--surface)}
.wd .l{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.wd .n{font:700 22px/1 var(--display)}
.wd .m{width:22px;height:22px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.wd .m.plan{border:2px solid var(--accent)}
.wd .m.done{background:var(--accent);border-color:var(--accent);color:#fff}
.wd .k{font-size:11px;color:var(--muted);font-weight:700;min-height:16px}

/* Agua */
.water{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.glasses{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:160px}
.glass{width:16px;height:24px;border-radius:3px 3px 6px 6px;border:2px solid var(--goal);opacity:.35}
.glass.f{background:var(--goal);opacity:1}

/* Calendario */
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-head h3{font:700 26px/1 var(--display);text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dh{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.cd{min-height:98px;border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.cd:hover{border-color:var(--muted)}
.cd.out{opacity:.4;background:var(--surface-2)}
.cd.today .dn{background:var(--accent);color:#fff}
.cd.sel{outline:2px solid var(--ink);outline-offset:-1px}
.cd .dn{font:700 15px/1 var(--display);width:24px;height:24px;border-radius:7px;display:grid;place-items:center}
.cd .ev{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.plan{border:1px dashed var(--accent);color:var(--accent)}
.ev.done{background:var(--accent);color:#fff}
.cd .meta{margin-top:auto;display:flex;gap:4px;align-items:center;font-size:10.5px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* Rutinas */
.rcard{display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--c,var(--accent))}
.rcard h3{font:700 22px/1.05 var(--display);text-transform:uppercase}
.days{display:flex;gap:4px}
.days b{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.days b.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.exlist{list-style:none;margin:0;padding:0;font-size:13px}
.exlist li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px dashed var(--line)}
.exlist li:first-child{border-top:0}
.exlist span:last-child{color:var(--muted);font-weight:700;white-space:nowrap}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:10px;border-bottom:1px solid var(--line);font-weight:600}
table.t td.r,table.t th.r{text-align:right}
.scroll-x{overflow-x:auto}

/* Comidas */
.datenav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.datenav strong{min-width:190px;text-align:center;font-weight:800}
.meal h3{display:flex;align-items:center;gap:8px}
.mtot{font-size:12px;color:var(--muted);font-weight:700}
.fooditem{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.fooditem:first-child{border-top:0}
.fooditem .mac{font-size:12px;color:var(--muted);font-weight:600}
.kc{font:700 18px/1 var(--display)}

/* Retos */
.ccard{display:flex;flex-direction:column;gap:12px}
.ccard h3{font:700 22px/1.05 var(--display);text-transform:uppercase}
.heat{display:flex;flex-wrap:wrap;gap:4px}
.heat i{width:14px;height:14px;border-radius:4px;background:var(--track)}
.heat i.f{background:var(--c,var(--goal))}
.heat i.p{background:var(--c,var(--goal));opacity:.45}
.heat i.t{outline:2px solid var(--ink);outline-offset:1px}
.heat i.fut{background:transparent;border:1px dashed var(--line)}
.bigpct{font:700 34px/1 var(--display)}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.tpl:hover{border-color:var(--goal)}
.tpl b{font-weight:800}
.tpl span{font-size:12px;color:var(--muted);font-weight:600}

/* Formularios y modal */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:9px 11px;font-weight:600}
.in:focus{outline:2px solid var(--goal);outline-offset:-1px;background:var(--surface)}
.in.sm{padding:6px 8px;text-align:center}
.frow{display:grid;gap:12px}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.toggle button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 11px;font-weight:700;cursor:pointer;font-size:13px}
.toggle button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.swatches{display:flex;gap:8px}
.swatches button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(8,11,16,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.mcard{background:var(--surface);border-radius:18px;width:min(720px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-head h2{font:700 24px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.m-body{padding:18px 20px;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:16px}
.m-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.m-foot:empty{display:none}
.exblock{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.exblock .eh{display:flex;gap:8px;align-items:center}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 40px 30px;gap:6px;align-items:center;font-size:12px}
.sets .hd{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.sets .sn{font:700 16px/1 var(--display);text-align:center;color:var(--muted)}
.chk{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:900}
.chk.on{background:var(--food);border-color:var(--food);color:#fff}
.erow{display:grid;grid-template-columns:1fr 64px 64px 76px 30px;gap:6px;align-items:center}
.lib{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.lib .li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.lib .li:first-child{border-top:0}
.lib .li:hover{background:var(--surface-2)}
.lib .li-wrap{border-top:1px solid var(--line)}
.lib .li-wrap:first-child{border-top:0}
.lib .li-wrap .li{border-top:0;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;cursor:pointer;grid-template-columns:1fr auto 18px;font:inherit;color:inherit}
.lib .li-wrap.open{background:var(--surface-2)}
.chev{color:var(--muted);font-size:12px}
.fedit{padding:4px 12px 14px;display:flex;flex-direction:column;gap:10px}
.fe-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.cu-grid{grid-template-columns:2fr repeat(4,1fr);align-items:end}
.cu-f{display:flex;flex-direction:column;gap:3px}
.fi-main{cursor:pointer;border-radius:8px}
.fi-main:hover .t{color:var(--food)}
@media (max-width:560px){.cu-grid{grid-template-columns:1fr 1fr}.cu-grid > input{grid-column:1/-1}}
.back{font-weight:700;color:var(--muted);text-decoration:none;font-size:13px}
.back:hover{color:var(--ink)}
.ch-link{color:inherit;text-decoration:none}.ch-link:hover{color:var(--c)}
.open-panel{justify-content:center;text-decoration:none;color:var(--ink)}
.heat i.h-ok{background:var(--c,var(--goal))}
.heat i.h-part{background:var(--c,var(--goal));opacity:.45}
.heat i.h-miss{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.heat i.h-pend{background:transparent;box-shadow:inset 0 0 0 2px var(--accent)}
.heat i.h-fut{background:transparent;border:1px dashed var(--line)}
.icon-btn:disabled{opacity:.25;cursor:default}
.rcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rcal .dh{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.rd{min-height:66px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;padding:7px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;min-width:0}
.rd .rn{font:700 17px/1 var(--display)}
.rd .rx{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;min-height:13px}
.rd.st-ok{background:var(--food);border-color:var(--food);color:#fff}
.rd.st-part{background:var(--food-soft);border-color:transparent;color:var(--food)}
.rd.st-miss{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.rd.st-pend{border:2px dashed var(--accent)}
.rd.st-fut{background:var(--surface-2);color:var(--muted)}
.rd.st-out{background:transparent;border-color:transparent;color:var(--muted);opacity:.35;cursor:default}
.rd.om{opacity:.4}
.rd.sel{outline:2.5px solid var(--ink);outline-offset:1px}
.rd.tdy .rn{text-decoration:underline;text-underline-offset:3px}
.rd:not(:disabled):hover{transform:translateY(-1px)}
.legend .lg{width:12px;height:12px;border-radius:4px;display:inline-block}
.lg.st-ok{background:var(--food)}.lg.st-miss{background:var(--accent-soft);border:1px solid var(--accent)}.lg.st-pend{border:2px dashed var(--accent)}.lg.st-fut{background:var(--surface-2);border:1px solid var(--line)}
.gauge{position:relative;height:10px;border-radius:99px;background:var(--track);margin:24px 0 4px}
.gz{position:absolute;top:0;bottom:0;background:var(--food-soft);box-shadow:inset 0 0 0 1.5px var(--food);border-radius:99px}
.gm{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;background:var(--accent);border-radius:2px}
.gm.ok{background:var(--food)}
.gm span{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;white-space:nowrap;color:var(--ink)}
.gl{position:relative;height:16px;font-size:10.5px}.gl span+span{transform:translateX(-50%)}
.chk-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.chk-row .cdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--accent-soft);color:var(--accent);flex:none}
.chk-row.ok .cdot{background:var(--food);color:#fff}

async function flush(){
  if(!remote||!dirty.size)return;
  if(saving){clearTimeout(flushTimer);flushTimer=setTimeout(flush,900);return}
  saving=true;setSync('saving');
  try{
    while(dirty.size){
      const k=[...dirty][0];dirty.delete(k);
      try{await remote.doc(k).set(docBody(k))}
      catch(e){
        if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await remote.doc(k).set(docBody(k))}catch(e2){dirty.add(k);throw e2}}
        else{dirty.add(k);throw e}

    }
    setSync('ok');
  }catch(e){
    if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){remote=null;dirty.clear();setSync('local')}
    else if(e&&e.code==='quota_exceeded'){setSync('error','Espacio lleno: borra registros antiguos')}
    else setSync('error','Error al guardar, se reintentará');
    if(remote&&dirty.size){clearTimeout(flushTimer);flushTimer=setTimeout(flush,8000)}
  }finally{saving=false}
}

function dayCheck(c,d){

/* ---------- componentes ---------- */
function ring(pct,size=92,stroke=10,color='var(--accent)'){
  const r=(size-stroke)/2,c=2*Math.PI*r,p=clamp(pct,0,1);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--track)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-p)).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
const bar=(v,g,color)=>`<div class="bar"><i style="width:${(clamp(g?v/g:0,0,1)*100).toFixed(1)}%;background:${v>g*1.08&&g?'var(--warn)':color}"></i></div>`;
function macros(t){
  const g=S.settings;
  return [['Proteína',t.p,g.protein,'var(--accent)'],['Carbohidratos',t.c,g.carbs,'var(--goal)'],['Grasas',t.f,g.fat,'var(--warn)']]
   .map(([l,v,goal,col])=>`<div class="macro"><span>${l}</span>${bar(v,goal,col)}<span class="v num"><b>${fmt(v)}</b> / ${fmt(goal)} g</span></div>`).join('');
}
function waterBlock(d){
  const ml=S.water[d]||0,goal=S.settings.water||2000,n=Math.max(8,Math.ceil(goal/250));
  const g=Array.from({length:n},(_,i)=>`<i class="glass ${i<Math.floor(ml/250)?'f':''}"></i>`).join('');

function topbar(eyebrow,title,actions=''){return `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1 class="title">${title}</h1></div><div class="actions">${actions}</div></div>`}
const plus='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

/* ---------- vistas ---------- */
function vPanel(){
  const t=today(),g=S.settings,tot=dayTotals(t);
  const wk=weekWorkouts(t),streak=calcStreak(),ws=sortedWeights();
  const last=ws[ws.length-1];
  const prev=ws.filter(w=>w.date<=addDays(t,-30)).pop()||ws[0];
  const delta=last&&prev&&last!==prev?last.kg-prev.kg:null;
  const left=g.kcal-tot.kcal;
  const kcalPct=tot.kcal/g.kcal;
  const plan=plannedFor(t),done=workoutsOn(t);
  const ws0=weekStart(t);
  const weekBars=Array.from({length:7},(_,i)=>{const d=addDays(ws0,i);const has=workoutsOn(d).length;return `<i style="display:block;width:10px;height:${has?26:8}px;border-radius:3px;background:${has?'var(--accent)':'var(--track)'}"></i>`}).join('');

  const planHtml=plan.length?plan.map(p=>{
    const r=p.routine,isDone=done.some(w=>w.routineId===r.id);
    return `<div class="row"><span class="stripe" style="background:${r.color}"></span><div class="grow"><div class="t">${esc(r.name)}</div><div class="s">${esc(r.focus)} · ${r.exercises.length} ejercicios · ${r.exercises.reduce((s,e)=>s+num(e.sets),0)} series</div></div>${isDone?'<span class="chip done">✓ Hecho</span>':`<button class="btn pri sm" data-act="start" data-id="${r.id}" data-d="${t}">Iniciar</button>`}</div>`}).join('')
    :`<div class="empty">Hoy es día de descanso según tu plan.<div style="margin-top:10px"><button class="btn sm" data-act="pick-workout" data-d="${t}">Entrenar igualmente</button></div></div>`;
  const extra=done.filter(w=>!plan.some(p=>p.routine.id===w.routineId)).map(w=>`<div class="row"><span class="stripe" style="background:var(--food)"></span><div class="grow"><div class="t">${esc(w.name)}</div><div class="s">${w.duration||0} min · ${fmt(workoutVolume(w))} kg de volumen</div></div><span class="chip done">✓ Hecho</span></div>`).join('');

  const active=S.challenges.filter(c=>{const i=chInfo(c);return i.status==='activo'}).slice(0,4);
  const chHtml=active.length?active.map(c=>{const i=chInfo(c);
    const btn=c.kind==='habit'?(i.doneToday?'<span class="chip done">✓ Hoy</span>':`<button class="btn sm goal" data-act="ch-check" data-id="${c.id}">Marcar hoy</button>`):`<button class="btn sm goal" data-act="ch-add" data-id="${c.id}">+ Registrar</button>`;
    return `<div class="row"><div class="grow"><div class="t">${esc(c.name)}</div><div class="s">Día ${i.dayN} de ${c.days} · ${fmt(i.total,1)} / ${fmt(i.target,1)} ${esc(c.unit)}</div><div style="margin-top:6px">${bar(i.pct,1,c.color)}</div></div>${btn}</div>`}).join('')
    :`<div class="empty">No tienes retos activos.<div style="margin-top:10px"><a class="btn sm" href="#retos">Crear un reto</a></div></div>`;

  const week=Array.from({length:7},(_,i)=>{const d=addDays(ws0,i);const pl=plannedFor(d).length,dn=workoutsOn(d).length,k=dayTotals(d).kcal;
    return `<button class="wd ${d===t?'today':''}" data-act="goto-day" data-d="${d}"><span class="l">${DOW[i]}</span><span class="n">${parse(d).getDate()}</span><span class="m ${dn?'done':pl?'plan':''}">${dn?'✓':''}</span><span class="k num">${k?fmt(k)+' kcal':''}</span></button>`}).join('');

  const recent=[...S.workouts].sort((a,b)=>a.date<b.date?1:-1).slice(0,5);
  const recentHtml=recent.length?recent.map(w=>`<div class="row"><span class="stripe" style="background:${routineById(w.routineId)?.color||'var(--muted)'}"></span><div class="grow"><div class="t">${esc(w.name)}</div><div class="s">${shortDate(w.date)} · ${w.duration||0} min · ${workoutSets(w)} series</div></div><span class="num" style="font-weight:800">${fmt(workoutVolume(w))} kg</span></div>`).join(''):'<div class="empty">Aún no has registrado sesiones. Pulsa «Iniciar» en tu rutina de hoy.</div>';

  return topbar(longDate(t),`Hola, ${esc(g.name||'atleta')}`,
    `<button class="btn" data-act="add-meal" data-d="${t}">${plus} Comida</button><button class="btn pri" data-act="pick-workout" data-d="${t}">${plus} Registrar entreno</button>`)+
  `<div class="grid g4">
    <div class="card kpi"><div class="ring-wrap">${ring(kcalPct,92,10,kcalPct>1.08?'var(--warn)':'var(--food)')}<span class="num">${Math.round(kcalPct*100)}%</span></div><div><div class="k-label">Calorías hoy</div><div class="k-val num">${fmt(tot.kcal)}<small>kcal</small></div><div class="k-sub">${left>=0?`Quedan ${fmt(left)} kcal`:`${fmt(-left)} kcal por encima`}</div></div></div>
    <div class="card kpi"><div style="display:flex;align-items:flex-end;gap:4px;height:40px">${weekBars}</div><div><div class="k-label">Entrenos semana</div><div class="k-val num">${wk.length}<small>/ ${g.weeklyWorkouts}</small></div><div class="k-sub">${wk.length>=g.weeklyWorkouts?'Objetivo semanal cumplido':`Faltan ${g.weeklyWorkouts-wk.length} sesiones`}</div></div></div>
    <div class="card kpi"><div class="ring-wrap">${ring(clamp(streak/30,0,1),92,10,'var(--accent)')}<span class="num">${streak}</span></div><div><div class="k-label">Racha</div><div class="k-val num">${streak}<small>${streak===1?'día':'días'}</small></div><div class="k-sub">Días seguidos con actividad</div></div></div>
    <div class="card kpi"><div><div class="k-label">Peso actual</div><div class="k-val num">${last?fmt(last.kg,1):'—'}<small>kg</small></div><div class="k-sub">${delta===null?'<button class="btn sm" data-act="add-weight">Registrar peso</button>':`<span class="${delta<=0?'up':'down'}">${delta>0?'+':''}${fmt(delta,1)} kg</span> desde ${shortDate(prev.date)}`}</div></div></div>
  </div>
  <div class="grid split" style="margin-top:16px">
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Plan de hoy</h3><a class="sub" href="#rutinas">Ver rutinas</a></div>${planHtml}${extra}</div>
      <div class="card"><div class="card-h"><h3>Nutrición de hoy</h3><a class="sub" href="#comidas">Ver comidas</a></div><div class="stack">${macros(tot)}<div style="border-top:1px solid var(--line);padding-top:14px">${waterBlock(t)}</div></div></div>
      <div class="card"><div class="card-h"><h3>Esta semana</h3><span class="sub">Toca un día para verlo en el calendario</span></div><div class="week">${week}</div></div>
    </div>
    <div class="stack">
      ${(()=>{const up=[];for(let i=0;i<7;i++){up.push(...tasksOn(addDays(t,i)).filter(x=>i===0||(x.status||'pending')==='pending'))}return up.length?`<div class="card tasks-card"><div class="card-h"><h3>Retos asignados</h3><span class="sub">Hoy y próximos 7 días</span></div><div class="stack">${up.map(x=>taskRow(x,true,true)).join('')}</div></div>`:''})()}
      <div class="card"><div class="card-h"><h3>Retos activos</h3><a class="sub" href="#retos">Todos</a></div>${chHtml}</div>
      <div class="card"><div class="card-h"><h3>Últimas sesiones</h3></div>${recentHtml}</div>
    </div>
  </div>`;
}

function vCalendario(){
  const [y,m]=ui.calMonth.split('-').map(Number);
  const first=`${y}-${pad(m)}-01`,start=weekStart(first);
  const t=today();
  let cells=DOW.map(d=>`<div class="dh">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=addDays(start,i);
    if(i>=35&&d.slice(0,7)!==ui.calMonth)break;
    const dn=workoutsOn(d),pl=plannedFor(d).filter(p=>!dn.some(w=>w.routineId===p.routine.id));
    const k=dayTotals(d).kcal;
    const chs=S.challenges.filter(c=>c.log&&c.log[d]).length;
    const tk=tasksOn(d);const ev=[...tk.map(x=>`<span class="ev task tk-${x.status||'pending'}">★ ${esc(x.title)}</span>`),...dn.map(w=>`<span class="ev done">${esc(w.name)}</span>`),...(d>=t?pl.map(p=>`<span class="ev plan">${esc(p.routine.name)}</span>`):[])].slice(0,3).join('');
    cells+=`<button class="cd ${d.slice(0,7)!==ui.calMonth?'out':''} ${d===t?'today':''} ${d===ui.calSel?'sel':''}" data-act="cal-sel" data-d="${d}"><span class="dn num">${parse(d).getDate()}</span>${ev}<span class="meta">${k?`<span class="dot" style="background:var(--food)"></span>${fmt(k)}`:''}${chs?` <span class="dot" style="background:var(--goal)"></span>${chs}`:''}</span></button>`;

  const d=ui.calSel,dn=workoutsOn(d),pl=plannedFor(d),tot=dayTotals(d);
  const chDone=S.challenges.filter(c=>c.log&&c.log[d]);
  const side=`<div class="card"><div class="card-h"><div><div class="eyebrow">${d===t?'Hoy':d<t?'Pasado':'Próximo'}</div><h3>${longDate(d)}</h3></div></div>
    <div class="stack">
      <div><div class="lbl" style="margin-bottom:8px">Entrenamiento</div>
        ${pl.map(p=>{const isDone=dn.some(w=>w.routineId===p.routine.id);return `<div class="row"><span class="stripe" style="background:${p.routine.color}"></span><div class="grow"><div class="t">${esc(p.routine.name)}</div><div class="s">${p.src==='week'?'Plan semanal':'Programada'}</div></div>${isDone?'<span class="chip done">✓</span>':`<button class="btn sm pri" data-act="start" data-id="${p.routine.id}" data-d="${d}">Registrar</button>`}${p.src==='one'?`<button class="icon-btn" data-act="unsched" data-id="${p.sid}" aria-label="Quitar">×</button>`:''}</div>`}).join('')}
        ${dn.filter(w=>!pl.some(p=>p.routine.id===w.routineId)).map(w=>`<div class="row"><span class="stripe" style="background:var(--food)"></span><div class="grow"><div class="t">${esc(w.name)}</div><div class="s">${w.duration||0} min · ${fmt(workoutVolume(w))} kg</div></div><span class="chip done">✓</span></div>`).join('')}
        ${dn.length?dn.map(w=>`<div class="row"><div class="grow s">Sesión: ${esc(w.name)}</div><button class="btn sm" data-act="edit-workout" data-id="${w.id}">Ver / editar</button></div>`).join(''):''}
        ${!pl.length&&!dn.length?'<div class="note">Sin entrenamiento planificado.</div>':''}
        <div class="actions" style="margin-top:10px"><button class="btn sm" data-act="sched" data-d="${d}">Programar rutina</button><button class="btn sm" data-act="pick-workout" data-d="${d}">Registrar sesión</button></div>
      </div>
      <div style="border-top:1px solid var(--line);padding-top:12px"><div class="lbl" style="margin-bottom:8px">Nutrición</div>
        <div style="display:flex;align-items:baseline;gap:8px"><span class="kc num">${fmt(tot.kcal)}</span><span class="note">kcal · ${tot.n} alimentos · ${fmt((S.water[d]||0)/1000,2)} L agua</span></div>
        <div class="note num">P ${fmt(tot.p)} g · C ${fmt(tot.c)} g · G ${fmt(tot.f)} g</div>
        <div class="actions" style="margin-top:10px"><button class="btn sm" data-act="open-meals" data-d="${d}">Ver comidas</button><button class="btn sm food" data-act="add-meal" data-d="${d}">${plus} Añadir</button></div>
      </div>
      ${tasksOn(d).length?`<div style="border-top:1px solid var(--line);padding-top:12px"><div class="lbl" style="margin-bottom:8px">Retos asignados</div><div class="stack">${tasksOn(d).map(x=>taskRow(x,true)).join('')}</div></div>`:''}
      <div style="border-top:1px solid var(--line);padding-top:12px"><div class="lbl" style="margin-bottom:8px">Retos</div>
        ${chDone.length?chDone.map(c=>`<div class="note">✓ ${esc(c.name)}${c.kind==='goal'?` · ${fmt(c.log[d],1)} ${esc(c.unit)}`:''}</div>`).join(''):'<div class="note">Sin registros de retos este día.</div>'}
      </div>
    </div></div>`;
  return topbar('Planificación','Calendario',`<button class="btn" data-act="sched" data-d="${ui.calSel}">Programar rutina</button>`)+
  `<div class="cal-wrap"><div class="card"><div class="cal-head"><button class="icon-btn" data-act="cal-move" data-v="-1" aria-label="Mes anterior">‹</button><h3>${MONTHS[m-1]} ${y}</h3><div style="display:flex;gap:4px"><button class="btn sm" data-act="cal-today">Hoy</button><button class="icon-btn" data-act="cal-move" data-v="1" aria-label="Mes siguiente">›</button></div></div>
  <div class="cal">${cells}</div>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Entreno hecho</span><span><i class="dot" style="border:1.5px dashed var(--accent)"></i>Planificado</span><span><i class="dot" style="background:var(--food)"></i>kcal registradas</span><span><i class="dot" style="background:var(--goal)"></i>Retos marcados</span><span style="color:var(--warn)">${STAR} Reto asignado</span></div></div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto"><span class="note">${sets} series · ${lastW?`Última: ${shortDate(lastW.date)}`:'Sin sesiones aún'}</span><button class="btn pri sm" data-act="start" data-id="${r.id}" data-d="${today()}">Iniciar sesión</button></div>

}

function vComidas(){
  const d=ui.mealDate,tot=dayTotals(d),g=S.settings,pct=tot.kcal/g.kcal;
  const secs=MEALS.map(([k,l])=>{
    const items=S.meals.filter(m=>m.date===d&&m.type===k);
    const kc=items.reduce((s,m)=>s+m.kcal,0);
    return `<div class="card meal"><div class="card-h"><h3>${l} <span class="mtot num">${fmt(kc)} kcal</span></h3><button class="btn sm food" data-act="add-meal" data-d="${d}" data-type="${k}">${plus} Añadir</button></div>
      ${items.length?items.map(m=>`<div class="fooditem"><div class="fi-main" role="button" tabindex="0" data-act="edit-meal" data-id="${m.id}" title="Toca para cambiar cantidad"><div class="t" style="font-weight:700">${esc(m.name)}</div><div class="mac num">${esc(m.portion||'')} · P ${fmt(m.p,1)} · C ${fmt(m.c,1)} · G ${fmt(m.f,1)}</div></div><span class="kc num">${fmt(m.kcal)}</span><button class="icon-btn" data-act="del-meal" data-id="${m.id}" aria-label="Eliminar">×</button></div>`).join(''):'<div class="note">Nada registrado.</div>'}
    </div>`}).join('');

  `<div class="grid split"><div class="grid g2" style="align-content:start">${secs}</div>
   <div class="stack"><div class="card"><div class="card-h"><h3>Resumen del día</h3></div>
     <div style="display:flex;align-items:center;gap:18px;margin-bottom:16px"><div class="ring-wrap">${ring(pct,120,12,pct>1.08?'var(--warn)':'var(--food)')}<span class="num" style="font-size:24px">${fmt(tot.kcal)}</span></div><div><div class="k-label lbl">Objetivo</div><div class="kc num" style="font-size:30px">${fmt(g.kcal)} kcal</div><div class="note">${g.kcal-tot.kcal>=0?`Quedan ${fmt(g.kcal-tot.kcal)} kcal`:`${fmt(tot.kcal-g.kcal)} kcal por encima`}</div></div></div>
     <div class="stack">${macros(tot)}</div></div>
     <div class="card">${waterBlock(d)}</div>
     <div class="card"><div class="card-h"><h3>Últimos 7 días</h3><span class="sub">kcal</span></div>${kcalChart(d)}</div>
   </div></div>`;
}
function kcalChart(end){
  const days=Array.from({length:7},(_,i)=>addDays(end,i-6));
  const vals=days.map(d=>dayTotals(d).kcal),goal=S.settings.kcal;
  const max=Math.max(goal*1.15,...vals),W=320,H=150,bw=30,gap=(W-7*bw)/7;
  const gy=H-20-(goal/max)*(H-34);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Calorías de los últimos 7 días">
   <line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W}" y="${gy-5}" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="700">Objetivo ${fmt(goal)}</text>
   ${vals.map((v,i)=>{const h=(v/max)*(H-34),x=gap/2+i*(bw+gap);return `<rect x="${x}" y="${H-20-h}" width="${bw}" height="${Math.max(h,0)}" rx="5" fill="${days[i]===end?'var(--food)':'var(--food)'}" opacity="${days[i]===end?1:.45}"/><text x="${x+bw/2}" y="${H-5}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="800">${DOW[dow(days[i])]}</text>`}).join('')}
  </svg>`;
}

function vRetos(){
  const list=[...S.challenges].sort((a,b)=>{const o={activo:0,'próximo':1,completado:2,finalizado:3};return o[chInfo(a).status]-o[chInfo(b).status]});
  const cards=list.map(c=>{
    const i=chInfo(c),t=today();
    const inf=ownerInfo(c);const cells=Array.from({length:c.days},(_,k)=>{const d=addDays(c.start,k);const x=inf(d);return `<i class="h-${x.st} ${d===t?'t':''}" title="${shortDate(d)}${x.lab?': '+x.lab:''}"></i>`}).join('');
    const vf=verifyOf(c),okToday=c.kind!=='habit'||vf==='manual'||dayCheck(c,t).ok;

function weightChart(ws){
  if(ws.length<2)return `<div class="empty">Registra tu peso al menos dos veces para ver la tendencia.<div style="margin-top:10px"><button class="btn sm" data-act="add-weight">Registrar peso</button></div></div>`;
  const pts=ws.slice(-60),W=640,H=230,L=40,R=14,T=14,B=26;
  const ks=pts.map(p=>p.kg);let mn=Math.min(...ks),mx=Math.max(...ks);const padv=Math.max(0.5,(mx-mn)*0.15);mn=Math.floor((mn-padv)*2)/2;mx=Math.ceil((mx+padv)*2)/2;
  const t0=parse(pts[0].date).getTime(),t1=parse(pts[pts.length-1].date).getTime()||t0+1;
  const X=d=>L+((parse(d).getTime()-t0)/((t1-t0)||1))*(W-L-R),Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(p.date).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(' ');
  const area=`${line} L${X(pts[pts.length-1].date).toFixed(1)},${H-B} L${L},${H-B} Z`;
  const ticks=Array.from({length:5},(_,i)=>mn+(mx-mn)*i/4);
  const lp=pts[pts.length-1];
  const xl=[pts[0],pts[Math.floor(pts.length/2)],lp].filter((p,i,a)=>a.indexOf(p)===i);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del peso"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-weight="700">${fmt(v,1)}</text>`).join('')}
   <path d="${area}" fill="url(#wg)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
   ${pts.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.kg)}" r="2.5" fill="var(--accent)"/>`).join('')}
   <circle cx="${X(lp.date)}" cy="${Y(lp.kg)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
   ${xl.map((p,i)=>`<text x="${X(p.date)}" y="${H-6}" text-anchor="${i===0?'start':p===lp?'end':'middle'}" font-size="11" fill="var(--muted)" font-weight="700">${shortDate(p.date)}</text>`).join('')}
  </svg>`;
}
function volChart(weeks){
  const W=640,H=200,L=10,B=26,T=22,max=Math.max(1,...weeks.map(w=>w.vol)),bw=46,gap=(W-L*2-8*bw)/7;
  if(!weeks.some(w=>w.vol))return '<div class="empty">Registra sesiones con peso para ver tu volumen semanal.</div>';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Volumen semanal">
   <line x1="0" x2="${W}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/>
   ${weeks.map((w,i)=>{const h=(w.vol/max)*(H-B-T),x=L+i*(bw+gap),cur=i===7;return `<rect x="${x}" y="${H-B-h}" width="${bw}" height="${h}" rx="6" fill="var(--accent)" opacity="${cur?1:.5}"/>${w.vol?`<text x="${x+bw/2}" y="${H-B-h-6}" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="800">${fmt(w.vol/1000,1)}t</text>`:''}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-weight="700">${shortDate(w.s)}</text>`}).join('')}
  </svg>`;
}

    input:e=>{const el=e.target;if(el.dataset.f)dr[el.dataset.f]=el.value;if(el.dataset.ex!==undefined){const x=dr.exercises[+el.dataset.ex];if(el.dataset.set!==undefined)x.sets[+el.dataset.set][el.dataset.k]=el.value;else x[el.dataset.k]=el.value}},
    act:(a,el)=>{
      const ei=+el.dataset.ex,si=+el.dataset.set;
      if(a==='done'){const s=dr.exercises[ei].sets[si];s.done=!s.done;el.classList.toggle('on',s.done);el.setAttribute('aria-pressed',s.done)}
      if(a==='add-set'){const st=dr.exercises[ei].sets;const l=st[st.length-1]||{reps:10,weight:0};st.push({reps:l.reps,weight:l.weight,done:false});drawModal()}
      if(a==='rm-set'){dr.exercises[ei].sets.splice(si,1);drawModal()}
      if(a==='add-ex'){dr.exercises.push({name:'',sets:[{reps:10,weight:0,done:false}]});drawModal()}
      if(a==='rm-ex'){dr.exercises.splice(+el.dataset.v,1);drawModal()}
      if(a==='del'){const id=dr.id,mo=dr.date.slice(0,7);confirmBox('¿Eliminar esta sesión?',()=>{S.workouts=S.workouts.filter(x=>x.id!==id);touch('w-'+mo)})}
      if(a==='save'){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(dr.date)){toast('Elige una fecha válida');return}
        dr.name=(dr.name||'').trim()||'Sesión libre';
        dr.duration=Math.round(num(dr.duration))||(isNew?Math.max(1,Math.round((Date.now()-t0)/60000)):0);
        dr.exercises=dr.exercises.filter(e=>e.name.trim()).map(e=>({name:e.name.trim(),sets:e.sets.map(s=>({reps:num(s.reps),weight:num(s.weight),done:!!s.done}))}));
        const old=S.workouts.find(x=>x.id===dr.id);
        const keys=['w-'+dr.date.slice(0,7)];if(old&&old.date.slice(0,7)!==dr.date.slice(0,7))keys.push('w-'+old.date.slice(0,7));
        S.workouts=S.workouts.filter(x=>x.id!==dr.id);S.workouts.push(dr);
        touch(...keys);closeModal();render();toast(isNew?'¡Sesión registrada! 💪':'Sesión actualizada');
      }
    }});
}
function startWorkout(routineId,date){
  const r=routineById(routineId);
  const w={id:nid(),date,routineId:r?r.id:null,name:r?r.name:'Sesión libre',duration:'',notes:'',
    exercises:r?r.exercises.map(e=>({name:e.name,sets:Array.from({length:num(e.sets)||1},()=>({reps:String(e.reps).split('-')[0],weight:e.weight,done:false}))})):[{name:'',sets:[{reps:10,weight:0,done:false}]}]};
  workoutModal(w,true);
}
function pickRoutine(date,mode){

/* comida */
function mealModal(date,type,editEntry){
  const st={type:editEntry?editEntry.type:(type||guessMeal()),q:'',tab:'todos',open:null,amt:1,ui:0,cu:{name:'',amt:100,p:'',c:'',f:''}};
  // al editar: el alimento original o uno construido con los valores guardados
  let editFood=null;
  if(editEntry){
    editFood=foodById(editEntry.fid);
    if(editFood){st.open=editFood.id;st.ui=Math.max(0,editFood.units.findIndex(u=>u.l===editEntry.unit));st.amt=editEntry.amt}
    else{editFood={id:'tmp',name:editEntry.name,cat:'mine',kcal:editEntry.kcal,p:editEntry.p,c:editEntry.c,f:editEntry.f,base:'g',units:[{l:'porción',g:100}],du:0,da:1};st.open='tmp';st.ui=0;st.amt=1}
  }
  const recentIds=()=>{const out=[];[...S.meals].reverse().forEach(m=>{if(m.fid&&!out.includes(m.fid)&&foodById(m.fid))out.push(m.fid)});return out.slice(0,15)};
  const visible=()=>{
    if(editEntry)return[editFood];
    const q=st.q.trim().toLowerCase();
    let list=st.tab==='herbalife'?FOODS.filter(f=>f.cat==='herbalife'):st.tab==='mine'?(S.foods||[]):st.tab==='recent'?recentIds().map(foodById):allFoods();
    if(q)list=list.filter(f=>f.name.toLowerCase().includes(q));
    return list;
  };
  const calcLine=f=>{const r=calcFood(f,st.amt,st.ui);return `<span class="kc num" style="font-size:24px">${fmt(r.kcal)}</span> <span class="note">kcal</span><span class="note num" style="margin-left:10px">${fmt(r.g)} ${f.base} · P ${fmt(r.p,1)} g · C ${fmt(r.c,1)} g · G ${fmt(r.f,1)} g</span>`};
  const editor=f=>`<div class="fedit">
      <div class="fe-row">
        <div class="field"><label for="fe-amt">Cantidad</label><div style="display:flex;gap:4px"><button type="button" class="btn sm" data-m="step" data-v="-1" aria-label="Menos">−</button><input class="in sm num" id="fe-amt" data-q="amt" value="${st.amt}" inputmode="decimal" style="width:78px"><button type="button" class="btn sm" data-m="step" data-v="1" aria-label="Más">+</button></div></div>
        <div class="field" style="flex:1;min-width:150px"><label for="fe-unit">Unidad</label><select class="in" id="fe-unit" data-q="unit">${f.units.map((u,i)=>`<option value="${i}" ${i===st.ui?'selected':''}>${esc(unitLabel(u,f.base))}</option>`).join('')}</select></div>
      </div>
      <div id="fe-calc">${calcLine(f)}</div>
      <div class="note">Valores por 100 ${f.base}: ${fmt(f.kcal)} kcal · P ${fmt(f.p,1)} · C ${fmt(f.c,1)} · G ${fmt(f.f,1)}${f.approx?' · valores aproximados':''}</div>
      <div><button type="button" class="btn food" data-m="${editEntry?'save-edit':'add'}" data-v="${esc(f.id)}">${editEntry?'Guardar cambios':`${plus} Añadir a ${MEALS.find(m=>m[0]===st.type)[1]}`}</button></div>
    </div>`;
  const listHtml=()=>{
    const r=visible();
    if(!r.length)return `<div class="li"><div class="note">${st.tab==='mine'?'Aún no has creado alimentos. Usa «Alimento personalizado» abajo.':st.tab==='recent'?'Aún no hay alimentos recientes.':'Sin resultados. Créalo abajo como alimento personalizado.'}</div></div>`;
    return r.map(f=>{const u=f.units[f.du]||f.units[0];const d=calcFood(f,f.da,f.du);const isOpen=st.open===f.id;
      return `<div class="li-wrap ${isOpen?'open':''}"><button type="button" class="li" data-m="open" data-v="${esc(f.id)}" aria-expanded="${isOpen}">
        <div style="text-align:left"><div style="font-weight:700">${esc(f.name)} ${f.cat==='herbalife'?'<span class="chip food">Herbalife</span>':f.cat==='mine'?'<span class="chip goal">Mío</span>':''}</div><div class="note num">${fmt(f.da,2)} ${esc(unitLabel(u,f.base))} · P ${fmt(d.p,1)} · C ${fmt(d.c,1)} · G ${fmt(d.f,1)}</div></div>
        <span class="kc num">${fmt(d.kcal)}</span><span class="chev" aria-hidden="true">${isOpen?'▴':'▾'}</span></button>
        ${isOpen?editor(f):''}${isOpen&&f.cat==='mine'&&!editEntry?`<div style="padding:0 12px 10px"><button type="button" class="btn sm ghost danger" data-m="del-food" data-v="${esc(f.id)}">Eliminar de mis alimentos</button></div>`:''}</div>`}).join('');
  };
  const cuK=()=>Math.round(num(st.cu.p)*4+num(st.cu.c)*4+num(st.cu.f)*9);
  const openFood=id=>{const f=allFoods().find(x=>x.id===id)||(editFood&&editFood.id===id?editFood:null);if(!f)return;
    if(st.open===id&&!editEntry){st.open=null}else{st.open=id;st.ui=f.du;st.amt=f.da}
    $('#lib').innerHTML=listHtml();const a=$('#fe-amt');if(a){a.focus();a.select()}};
  const refreshCalc=()=>{const f=st.open&&(foodById(st.open)||editFood);const el=$('#fe-calc');if(f&&el)el.innerHTML=calcLine(f)};
  const entryFrom=(f,base)=>{const r=calcFood(f,st.amt,st.ui);return{...base,type:st.type,fid:f.id==='tmp'?(editEntry&&editEntry.fid)||null:f.id,name:f.name,amt:num(st.amt),unit:r.u.l,portion:`${fmt(st.amt,2)} ${unitLabel(r.u,f.base)}`,grams:Math.round(r.g),kcal:Math.round(r.kcal),p:+r.p.toFixed(1),c:+r.c.toFixed(1),f:+r.f.toFixed(1)}};
  openModal({title:editEntry?'Editar alimento':'Añadir comida',
    body:()=>`<div class="note">${longDate(date)}</div>
      <div class="field"><span class="lbl">Comida</span><div class="toggle">${MEALS.map(([k,l])=>`<button type="button" class="${st.type===k?'on':''}" data-m="type" data-v="${k}">${l}</button>`).join('')}</div></div>
      ${editEntry?'':`<div class="field"><label for="f-q">Buscar alimento</label><input class="in" id="f-q" data-q="q" value="${esc(st.q)}" placeholder="Pollo, arroz, Formula 1…" autofocus autocomplete="off"></div>
      <div class="toggle">${[['todos','Todos'],['herbalife','Herbalife'],['mine','Mis alimentos'],['recent','Recientes']].map(([k,l])=>`<button type="button" class="${st.tab===k?'on':''}" data-m="tab" data-v="${k}">${l}</button>`).join('')}</div>`}
      <div class="lib" id="lib" ${editEntry?'style="max-height:none"':''}>${listHtml()}</div>
      ${editEntry?'':`<div class="exblock"><div class="lbl">Alimento personalizado</div>
        <div class="frow cu-grid"><input class="in" data-c="name" placeholder="Nombre" value="${esc(st.cu.name)}" aria-label="Nombre"><div class="cu-f"><span class="note">Cantidad (g)</span><input class="in sm num" data-c="amt" value="${esc(st.cu.amt)}" inputmode="decimal" aria-label="Cantidad en gramos"></div><div class="cu-f"><span class="note">Proteína g</span><input class="in sm num" data-c="p" value="${esc(st.cu.p)}" inputmode="decimal" aria-label="Proteína"></div><div class="cu-f"><span class="note">Carbos g</span><input class="in sm num" data-c="c" value="${esc(st.cu.c)}" inputmode="decimal" aria-label="Carbohidratos"></div><div class="cu-f"><span class="note">Grasas g</span><input class="in sm num" data-c="f" value="${esc(st.cu.f)}" inputmode="decimal" aria-label="Grasas"></div></div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><span class="kc num" id="cu-k" style="font-size:24px">${cuK()}</span> <span class="note">kcal calculadas (P×4 + C×4 + G×9)</span></div><button type="button" class="btn sm food" data-m="custom">${plus} Guardar y añadir</button></div></div>`}`,
    foot:()=>`<button class="btn ${editEntry?'':'pri'}" data-m="close">${editEntry?'Cancelar':'Listo'}</button>`,
    input:e=>{const el=e.target,q=el.dataset.q;
      if(q==='q'){st.q=el.value;$('#lib').innerHTML=listHtml()}
      if(q==='amt'){st.amt=Math.max(0,num(el.value));refreshCalc()}
      if(q==='unit'){const f=foodById(st.open)||editFood;const old=f.units[st.ui],nu=f.units[+el.value];const g=num(st.amt)*old.g;st.ui=+el.value;st.amt=nu.g===1?Math.round(g):+(g/nu.g).toFixed(2)||1;$('#fe-amt').value=st.amt;refreshCalc()}
      if(el.dataset.c){st.cu[el.dataset.c]=el.value;const k=$('#cu-k');if(k)k.textContent=cuK()}},
    act:(a,el)=>{
      if(a==='type'){st.type=el.dataset.v;drawModal();if(st.open)openFoodKeep()}
      if(a==='tab'){st.tab=el.dataset.v;st.open=null;drawModal()}
      if(a==='open')openFood(el.dataset.v);
      if(a==='step'){const f=foodById(st.open)||editFood;const u=f.units[st.ui];const step=u.g===1?(f.base==='ml'?50:10):0.5;st.amt=Math.max(0,+(num(st.amt)+step*num(el.dataset.v)).toFixed(2));$('#fe-amt').value=st.amt;refreshCalc()}
      if(a==='add'){const f=foodById(el.dataset.v);if(!f||!(num(st.amt)>0)){toast('Indica una cantidad');return}
        S.meals.push(entryFrom(f,{id:nid(),date}));touch('m-'+date.slice(0,7));render();toast(`${f.name} añadido`);st.open=null;$('#lib').innerHTML=listHtml()}
      if(a==='save-edit'){const f=foodById(st.open)||editFood;if(!(num(st.amt)>0)){toast('Indica una cantidad');return}
        const i=S.meals.findIndex(m=>m.id===editEntry.id);if(i>=0)S.meals[i]=entryFrom(f,{id:editEntry.id,date:editEntry.date});
        touch('m-'+editEntry.date.slice(0,7));closeModal();render();toast('Alimento actualizado')}
      if(a==='del-food'){S.foods=(S.foods||[]).filter(f=>f.id!==el.dataset.v);touch('foods');st.open=null;$('#lib').innerHTML=listHtml()}
      if(a==='custom'){const c=st.cu,amt=num(c.amt)||100,k=cuK();if(!c.name.trim()||!k){toast('Indica nombre y al menos un macro');return}
        const f={id:'m:'+nid(),name:c.name.trim(),cat:'mine',kcal:k/amt*100,p:num(c.p)/amt*100,c:num(c.c)/amt*100,f:num(c.f)/amt*100,base:'g',units:[{l:'g',g:1},{l:'porción',g:amt}],du:1,da:1};
        S.foods=[f,...(S.foods||[])];st.ui=1;st.amt=1;S.meals.push(entryFrom(f,{id:nid(),date}));
        touch('foods','m-'+date.slice(0,7));render();toast(`${f.name} guardado y añadido`);st.cu={name:'',amt:100,p:'',c:'',f:''};st.open=null;drawModal()}
    }});
  function openFoodKeep(){const a=$('#fe-amt');if(a)a.focus()}
}
function guessMeal(){const h=new Date().getHours();return h<11?'desayuno':h<16?'almuerzo':h<21?'cena':'snack'}

        <div class="note" id="c-range">Rango válido: ${fmt(num(dr.kcalGoal)*(1-num(dr.tol)/100))} – ${fmt(num(dr.kcalGoal)*(1+num(dr.tol)/100))} kcal</div>`:''}`:''}

function challengeAddModal(c,day){

    body:()=>`<div class="note">${esc(c.name)} · ${longDate(t)}: llevas ${fmt(num(c.log?.[t]),1)} ${esc(c.unit)}</div><div class="field"><label for="ca-v">¿Cuánto sumas? (${esc(c.unit)})</label><input class="in num" id="ca-v" data-f="v" inputmode="decimal" autofocus placeholder="0"></div>`,

const STAR='<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
const sharedChallenges=()=>S.challenges.filter(c=>c.share&&c.share.on);
function tasksOn(d,shareId){const ids=new Set(sharedChallenges().map(c=>c.share.id));return TASKS.list.filter(x=>x.day===d&&ids.has(x.shareId)&&(!shareId||x.shareId===shareId))}
function ensureTaskSubs(){
  if(inClaude()||!fbCfg()||!FB.db)return;
  sharedChallenges().forEach(c=>{const sid=c.share.id;if(TASKS.subs[sid])return;
    TASKS.subs[sid]=FB.db.collection('shares').doc(sid).collection('tasks').onSnapshot(s=>{
      const items=s.docs.map(d=>({id:d.id,shareId:sid,chId:c.id,chName:c.name,...d.data()}));
      let seen;try{seen=JSON.parse(localStorage.getItem('forja-tasks-seen')||'null')}catch(e){seen=null}
      const first=!seen;seen=new Set(seen||[]);
      const fresh=items.filter(x=>!seen.has(x.id));
      fresh.forEach(x=>seen.add(x.id));
      try{localStorage.setItem('forja-tasks-seen',JSON.stringify([...seen]))}catch(e){}
      if(!first&&fresh.length){const x=fresh[0];toast(`${x.name} te asignó «${x.title}» para el ${shortDate(x.day)}`)}
      TASKS.list=[...TASKS.list.filter(x=>x.shareId!==sid),...items];
      try{localStorage.setItem('forja-tasks',JSON.stringify(TASKS.list))}catch(e){}
      if(APP_STARTED&&!M)render();
    },()=>{});
  });
}
function taskChip(st){return st==='done'?'<span class="chip done">✓ Cumplido</span>':st==='missed'?'<span class="chip acc">No cumplido</span>':'<span class="chip goal">Pendiente</span>'}
function taskRow(x,owner,showDate){
  const st=x.status||'pending',t=today();
  const head=`<span class="tk-ic">${STAR}</span><div class="grow"><div class="t">${esc(x.title)}</div><div class="s">De ${esc(x.name||'Anónimo')}${showDate?` · ${shortDate(x.day)}`:''}${x.note?` · ${esc(x.note)}`:''}</div></div>`;
  if(!owner)return `<div class="task st-${st}">${head}${taskChip(st)}${taskReplyHtml(x)}</div>`;
  const del=`<button class="icon-btn" data-act="task-del" data-sid="${x.shareId}" data-id="${x.id}" aria-label="Eliminar reto asignado" title="Eliminar">×</button>`;
  let act='';
  if(x.day<=t)act=st==='pending'?`<button class="btn sm goal" data-act="task-set" data-sid="${x.shareId}" data-id="${x.id}" data-v="done">✓ Lo cumplí</button><button class="btn sm" data-act="task-set" data-sid="${x.shareId}" data-id="${x.id}" data-v="missed">No lo cumplí</button>`:`${taskChip(st)}<button class="btn sm ghost" data-act="task-set" data-sid="${x.shareId}" data-id="${x.id}" data-v="pending">Deshacer</button>`;
  else act='<span class="chip">Próximo</span>';
  if(x.day<=t)act+=`<button class="btn sm ghost" data-act="task-reply" data-sid="${x.shareId}" data-id="${x.id}">${x.reply||x.replyPhoto?'Editar respuesta':'💬 Responder'}</button>`;
  return `<div class="task st-${st}">${head}${del}<div class="tk-act">${act}</div>${taskReplyHtml(x)}</div>`;
}

function weightCard(c){
  if(!c.trackWeight)return '';
  const end=addDays(c.start,c.days-1),t=today(),last=t<end?t:end;
  const pts=sortedWeights().filter(w=>w.date>=c.start&&w.date<=last);
  const before=sortedWeights().filter(w=>w.date<c.start).pop();
  const start=pts[0]||before,cur=pts[pts.length-1];
  const diff=start&&cur?cur.kg-start.kg:null;
  return `<div class="card"><div class="card-h"><h3>Peso en el reto</h3><span class="sub">${pts.length} registros</span></div>
    <div class="wrow"><div><span class="lbl">Inicio</span><b class="num">${start?fmt(start.kg,1):'—'}</b></div><div><span class="lbl">Ahora</span><b class="num">${cur?fmt(cur.kg,1):'—'}</b></div><div><span class="lbl">Cambio</span><b class="num ${diff===null?'':diff<=0?'up':'down'}">${diff===null?'—':(diff>0?'+':'')+fmt(diff,1)} kg</b></div></div>
    ${pts.length>=2?weightChart(pts):'<div class="note">Anota tu peso en los días del reto para ver la tendencia.</div>'}</div>`;
}

const CLOUD={ready:false,checked:false,at:null,size:0,busy:false,timer:null,msg:''};
const PF={email:{msg:'',ok:false,busy:false},pass:{msg:'',ok:false,busy:false}};
const backupJSON=()=>JSON.stringify({app:'forja',version:1,exportedAt:new Date().toISOString(),data:S});

function readBackup(txt){
  const o=JSON.parse(txt);const d=o&&o.data&&o.app==='forja'?o.data:o;
  if(!d||typeof d!=='object'||!('routines' in d||'meals' in d||'workouts' in d))throw new Error('El archivo no es una copia de Forja.');
  return normalize(d);
}
function applyBackup(n){
  const fb=S.settings.fb,auto=S.settings.cloudAuto;S=n;
  if(!S.settings.fb&&fb)S.settings.fb=fb;if(auto!==undefined&&S.settings.cloudAuto===undefined)S.settings.cloudAuto=auto;

const backupSummary=d=>`${d.workouts.length} entrenos · ${d.meals.length} alimentos registrados · ${d.challenges.length} retos · ${d.routines.length} rutinas · ${d.weights.length} pesos · ${(d.photos||[]).length} fotos`;

function downloadBackup(){
  const js=backupJSON();
  if(inClaude()){exportModal();return}
  const blob=new Blob([js],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`forja-copia-${today()}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  S.settings.lastBackup=Date.now();touch('settings');render();toast('Copia descargada');

/* copia en la nube: backups/{uid} */
async function cloudSave(silent){
  if(!cloudOk())return;const js=backupJSON();
  if(js.length>950000){CLOUD.msg='La copia es demasiado grande para la nube. Descarga el archivo.';if(!silent)toast(CLOUD.msg);return}
  CLOUD.busy=true;if(!silent)render();
  try{await FB.db.collection('backups').doc(FB.uid).set({app:'forja',data:js,size:js.length,updatedAt:Date.now()});CLOUD.at=Date.now();CLOUD.size=js.length;CLOUD.msg='';if(!silent)toast('Copia guardada en la nube ✓')}
  catch(e){CLOUD.msg=e.code==='permission-denied'?'Sin permiso: actualiza las reglas de Firestore (ver abajo).':'No se pudo guardar: '+(e.message||e.code);if(!silent)toast(CLOUD.msg)}
  finally{CLOUD.busy=false;renderAcct();if(location.hash==='#perfil'&&!M)render()}
}
async function cloudFetch(){const s=await FB.db.collection('backups').doc(FB.uid).get();return s.exists?s.data():null}

/* sincronización en tiempo real: backups/{uid} */
const DEVICE=(()=>{try{let d=localStorage.getItem('forja-device');if(!d){d=nid();localStorage.setItem('forja-device',d)}return d}catch(e){return nid()}})();
const SYNC={unsub:null,uid:null,at:null,timer:null,busy:false,msg:'',ready:false,localAt:0};
function markLocal(){SYNC.localAt=Date.now();try{localStorage.setItem('forja-sync-at:'+CURUID,SYNC.localAt)}catch(e){}}
function stopSync(){SYNC.unsub&&SYNC.unsub();SYNC.unsub=null;SYNC.uid=null;SYNC.ready=false;SYNC.at=null;SYNC.msg='';clearTimeout(SYNC.timer)}
function applyRemote(d){
  try{const n=readBackup(d.data);const fb=S.settings.fb;S=n;if(!S.settings.fb&&fb)S.settings.fb=fb;
    SYNC.localAt=d.updatedAt||Date.now();try{localStorage.setItem('forja-sync-at:'+CURUID,SYNC.localAt)}catch(e){}
    saveLocal();if(APP_STARTED)render()}catch(e){}
}
function startSync(){
  if(!cloudOk()||SYNC.uid===FB.uid)return;
  stopSync();SYNC.uid=FB.uid;
  SYNC.unsub=FB.db.collection('backups').doc(FB.uid).onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    const d=snap.exists?snap.data():null;
    if(!SYNC.ready){SYNC.ready=true;SYNC.msg='';
      if(!d){pushSync();return}
      SYNC.at=d.updatedAt;
      if(SYNC.legacy){let n=null;try{n=readBackup(d.data)}catch(e){}
        const same=n&&JSON.stringify({...n,settings:{...n.settings,fb:null,lastBackup:null}})===JSON.stringify({...S,settings:{...S.settings,fb:null,lastBackup:null}});
        if(!(n&&!same)){SYNC.legacy=false;try{localStorage.removeItem('forja-legacy:'+CURUID)}catch(e){}}
        if(n&&!same&&(S.workouts.length||S.meals.length||S.weights.length||S.challenges.length||S.routines.length)){syncConflict(n,d);renderAcct();return}}
      if((d.updatedAt||0)>=SYNC.localAt)applyRemote(d);else pushSync();
      renderAcct();return}
    if(d&&d.device!==DEVICE&&(d.updatedAt||0)>SYNC.localAt){applyRemote(d);toast('Datos actualizados desde otro dispositivo')}
    if(d){SYNC.at=d.updatedAt;renderAcct()}
  },e=>{SYNC.msg=e.code==='permission-denied'?'Sin permiso para sincronizar: publica las reglas actualizadas (Perfil → Copiar reglas).':'Sin conexión con la nube. Se sincronizará al volver.';renderAcct();if(location.hash==='#perfil'&&!M)render()});
}
function syncConflict(n,d){
  const mine=JSON.parse(JSON.stringify(S));
  SYNC.ready=false;
  openModal({title:'¿Qué datos conservamos?',body:()=>`<p style="margin:0">Activamos la sincronización automática. Este dispositivo y tu cuenta tienen datos distintos. Elige cuáles quieres usar en <b>todos</b> tus dispositivos:</p>
    <div class="stack"><div class="exblock"><b>Los de este dispositivo</b><div class="note">${backupSummary(mine)} · objetivo ${fmt(mine.settings.kcal)} kcal</div></div>
    <div class="exblock"><b>Los de tu cuenta en la nube</b><div class="note">${backupSummary(n)} · objetivo ${fmt(n.settings.kcal)} kcal · guardados el ${dateTime(d.updatedAt)}</div></div></div>
    <p class="note" style="margin:0">Solo te lo preguntamos esta vez. Si dudas, elige el dispositivo donde registraste lo último.</p>`,
    foot:()=>`<button class="btn" data-m="cloud">Usar los de la nube</button><button class="btn pri" data-m="local">Usar los de este dispositivo</button>`,
    act:a=>{if(a==='local'||a==='cloud'){SYNC.legacy=false;try{localStorage.removeItem('forja-legacy:'+CURUID)}catch(e){}}
      if(a==='local'){SYNC.ready=true;markLocal();closeModal();pushSync();toast('Sincronización activada ✓')}
      if(a==='cloud'){SYNC.ready=true;applyRemote(d);closeModal();toast('Datos cargados desde tu cuenta ✓')}}});
}
function scheduleSync(){if(!SYNC.ready||!cloudOk())return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushSync,1200)}
async function pushSync(){
  if(!cloudOk())return;const js=backupJSON();
  if(js.length>950000){SYNC.msg='Tus datos superan el tamaño máximo de la nube. Descarga una copia y avísame.';renderAcct();return}
  const at=Math.max(Date.now(),SYNC.localAt);SYNC.busy=true;renderAcct();
  try{await FB.db.collection('backups').doc(FB.uid).set({app:'forja',data:js,size:js.length,updatedAt:at,device:DEVICE});SYNC.at=at;SYNC.msg=''}
  catch(e){SYNC.msg=e.code==='permission-denied'?'Sin permiso para sincronizar: publica las reglas actualizadas (Perfil → Copiar reglas).':'No se pudo sincronizar. Se reintentará con el próximo cambio.'}
  finally{SYNC.busy=false;renderAcct();if(location.hash==='#perfil'&&!M)render()}
}
const cloudCheck=startSync;
function authErr(e){const c=e&&e.code||'';return c==='auth/invalid-credential'||c==='auth/wrong-password'||c==='auth/invalid-login-credentials'?'La contraseña actual no es correcta.':c==='auth/requires-recent-login'?'Por seguridad, cierra sesión y vuelve a entrar, luego inténtalo de nuevo.':authMsg(e)}
async function reauth(pass){const cred=firebase.auth.EmailAuthProvider.credential(FB.user.email,pass);await FB.user.reauthenticateWithCredential(cred)}

function vPerfil(){
  const u=FB.user,g=S.settings,hasFb=!!fbCfg()&&!inClaude();
  if(cloudOk())startSync();
  const ini=(g.name||u?.email||'?').trim().slice(0,1).toUpperCase();
  const since=u&&u.metadata&&u.metadata.creationTime?new Date(u.metadata.creationTime).toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):'';
  const msg=o=>o.msg?`<div class="${o.ok?'okbox':'warnbox'}" style="margin:0">${esc(o.msg)}</div>`:'';
  const pw=(id,ph,ac)=>`<div class="pw"><input class="in" id="${id}" type="password" autocomplete="${ac}" placeholder="${ph}">${eyeBtn()}</div>`;
  const js=backupJSON(),size=js.length;
  const old=!g.lastBackup||Date.now()-g.lastBackup>7*864e5;
  const account=!hasFb?`<div class="card"><div class="card-h"><h3>Tu cuenta</h3></div><p class="note" style="margin:0 0 12px">${inClaude()?'La cuenta con email y contraseña funciona en tu versión de GitHub.':'Conecta Firebase para tener una cuenta con email y contraseña, compartir retos y guardar copias en la nube.'}</p>${inClaude()?'':'<button class="btn goal" data-act="fb-setup">Conectar Firebase</button>'}</div>`
   :!u?`<div class="card"><div class="card-h"><h3>Tu cuenta</h3></div><button class="btn goal" data-act="fb-login">Iniciar sesión</button></div>`
   :`<div class="card"><div class="card-h"><h3>Cambiar email</h3></div>
      <form id="pfEmail" class="stack"><div class="field"><label for="pf-ne">Nuevo email</label><input class="in" id="pf-ne" type="email" autocomplete="email" placeholder="nuevo@email.com"></div>
      <div class="field"><label for="pf-ep">Contraseña actual</label>${pw('pf-ep','Para confirmar que eres tú','current-password')}</div>
      ${msg(PF.email)}<div class="note">Te llegará un enlace al nuevo email. El cambio se aplica cuando lo abras; hasta entonces sigues entrando con el actual.</div>
      <div><button class="btn pri" type="submit" ${PF.email.busy?'disabled':''}>${PF.email.busy?'Un momento…':'Cambiar email'}</button></div></form></div>
    <div class="card"><div class="card-h"><h3>Cambiar contraseña</h3></div>
      <form id="pfPass" class="stack"><div class="field"><label for="pf-cp">Contraseña actual</label>${pw('pf-cp','','current-password')}</div>
      <div class="frow g2"><div class="field"><label for="pf-np">Nueva contraseña</label>${pw('pf-np','Mínimo 6 caracteres','new-password')}</div><div class="field"><label for="pf-np2">Repite la nueva</label>${pw('pf-np2','','new-password')}</div></div>
      ${msg(PF.pass)}<div><button class="btn pri" type="submit" ${PF.pass.busy?'disabled':''}>${PF.pass.busy?'Un momento…':'Cambiar contraseña'}</button></div></form></div>`;
  const cloud=!hasFb||!u?`<div class="note">${hasFb?'Inicia sesión para sincronizar tus dispositivos.':'Disponible en tu versión de GitHub.'}</div>`
   :`<div class="bk-row"><div><b>${SYNC.msg?'Sincronización con problemas':'Sincronización activa'}</b><div class="note">Todo lo que registras se guarda solo en tu cuenta y aparece en tus otros dispositivos en unos segundos.</div></div><span class="chip ${SYNC.msg?'acc':'done'}">${SYNC.msg?'Revisar':'✓ Activa'}</span></div>
     <div class="note">Última sincronización: <b>${SYNC.busy?'guardando…':dateTime(SYNC.at)}</b></div>
     ${SYNC.msg?`<div class="warnbox" style="margin:0">${esc(SYNC.msg)}</div>`:''}
     <div class="actions"><button class="btn" data-act="cloud-save" ${SYNC.busy?'disabled':''}>Sincronizar ahora</button></div>`;
  return topbar('Cuenta','Perfil')+
  `<div class="grid split">
    <div class="stack">
      <div class="card"><div class="pf-head"><div class="pf-av">${esc(ini)}</div><div style="min-width:0"><h3 class="pf-name">${esc(g.name||'Sin nombre')}</h3>
        <div class="note" style="overflow-wrap:anywhere">${u?esc(u.email):'Sin cuenta conectada'} ${u?(u.emailVerified?'<span class="chip done">Email verificado</span>':'<span class="chip acc">Sin verificar</span>'):''}</div>
        ${since?`<div class="note">Miembro desde el ${since}</div>`:''}</div></div>
        <form id="pfName" class="frow" style="grid-template-columns:1fr auto;align-items:end;margin-top:16px"><div class="field"><label for="pf-name">Nombre</label><input class="in" id="pf-name" value="${esc(g.name||'')}" maxlength="40"></div><button class="btn" type="submit">Guardar</button></form>
        ${u&&!u.emailVerified?'<div class="actions" style="margin-top:12px"><button class="btn sm" data-act="pf-verify">Enviar email de verificación</button></div>':''}
        ${u?'<div class="actions" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><button class="btn ghost danger" data-act="fb-logout">Cerrar sesión</button></div>':''}
      </div>
      <div class="card"><div class="card-h"><h3>Mis objetivos</h3></div>${settingsForm()}</div>
      ${account}
    </div>
    <div class="stack">
      <div class="card"><div class="card-h"><h3>Copia de seguridad</h3>${old?'<span class="chip acc">Recomendado</span>':'<span class="chip done">Al día</span>'}</div>
        <div class="stack">
          <div class="okbox" style="background:var(--surface-2);color:var(--ink)">${backupSummary(S)} · ${kb(size)}</div>
          <div class="note">Última copia descargada: <b>${dateTime(g.lastBackup)}</b>${old?' · Haz una copia al menos una vez por semana.':''}</div>
          <div class="actions"><button class="btn pri" data-act="bk-download">Descargar copia (.json)</button><label class="btn" for="bk-file">Restaurar desde archivo</label><input type="file" id="bk-file" accept=".json,application/json" hidden></div>
          <div class="note">Guarda el archivo en Google Drive, en tu email o en tu ordenador. Si se borra el navegador, lo restauras aquí.</div>
        </div></div>
      <div class="card"><div class="card-h"><h3>Sincronización</h3></div><div class="stack">${cloud}</div></div>
      ${hasFb&&u?`<div class="card"><div class="card-h"><h3>Reglas de Firestore</h3></div><p class="note" style="margin:0 0 10px">La sincronización y los retos asignados necesitan las reglas actualizadas. Si ves «Sin permiso», cópialas y publícalas de nuevo en Firebase → Firestore → Regole.</p><button class="btn sm" data-act="copy-rules">Copiar reglas actualizadas</button></div>`:''}
      <div class="card danger-zone"><div class="card-h"><h3>Zona de peligro</h3></div><p class="note" style="margin:0 0 10px">Borra todos los datos guardados en este navegador. Haz una copia antes.</p><button class="btn danger" data-act="wipe">Borrar datos de este navegador</button></div>
    </div>
  </div>`;
}
async function pfSubmit(id){
  if(id==='pfName'){S.settings.name=$('#pf-name').value.trim();touch('settings');render();toast('Nombre guardado');return}
  if(id==='pfEmail'){const ne=$('#pf-ne').value.trim(),p=$('#pf-ep').value;const st=PF.email;
    if(!ne||!p){st.msg='Escribe el nuevo email y tu contraseña actual.';st.ok=false;render();return}
    if(ne===FB.user.email){st.msg='Ese ya es tu email.';st.ok=false;render();return}
    st.busy=true;st.msg='';render();
    try{await reauth(p);await FB.user.verifyBeforeUpdateEmail(ne);st.msg=`Listo. Abre el enlace que enviamos a ${ne} para confirmar el cambio.`;st.ok=true}
    catch(e){st.msg=authErr(e);st.ok=false}finally{st.busy=false;render()}}
  if(id==='pfPass'){const cp=$('#pf-cp').value,np=$('#pf-np').value,np2=$('#pf-np2').value;const st=PF.pass;
    if(!cp||!np){st.msg='Rellena la contraseña actual y la nueva.';st.ok=false;render();return}
    if(np.length<6){st.msg='La nueva contraseña debe tener al menos 6 caracteres.';st.ok=false;render();return}
    if(np!==np2){st.msg='Las dos contraseñas nuevas no coinciden.';st.ok=false;render();return}
    st.busy=true;st.msg='';render();
    try{await reauth(cp);await FB.user.updatePassword(np);st.msg='Contraseña cambiada ✓';st.ok=true}
    catch(e){st.msg=authErr(e);st.ok=false}finally{st.busy=false;render()}}
}

/* ---------- pantalla de acceso ---------- */
const EYE='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 5.1A11 11 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
const eyeBtn=()=>`<button type="button" class="eye" data-eye aria-label="Mostrar contraseña" aria-pressed="false">${EYE}</button>`;
const GATE={mode:'login',msg:'',ok:false,busy:false,email:'',loading:false,err:''};
let APP_STARTED=false;
const gateActive=()=>!VIEWER&&!inClaude()&&!!fbCfg();
function startApp(){
  if(gateActive()&&FB.uid)useAccount(FB.uid);
  if(APP_STARTED){render();schedulePublish();startSync();return}
  APP_STARTED=true;render();if(!loadLocal())saveLocal();setSync('local');connect();
  if(fbCfg()&&!inClaude())fbInit(fbCfg(),false).then(()=>{ensureTaskSubs();render();schedulePublish();startSync()}).catch(()=>{});
}
function onAuthChange(u){
  PF.email.msg='';PF.pass.msg='';
  if(!u||u.uid!==SYNC.uid)stopSync();
  if(!u&&gateActive()){CURUID=null;S=defaults()}
  if(u&&!gateActive()&&APP_STARTED)startSync();
  if(gateActive()){if(u){hideGate();startApp()}else{renderGate()}}
  else{if(u)schedulePublish();if(APP_STARTED)render()}
}
function renderGate(){
  let g=$('#gate');if(!g){g=document.createElement('div');g.id='gate';document.body.appendChild(g)}
  g.hidden=false;document.body.classList.add('gated');if(M)closeModal();
  const login=GATE.mode==='login';
  const mark='<div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></div>';
  let inner;
  if(GATE.loading)inner=`<p class="note" style="margin:0">Cargando…</p>`;
  else if(GATE.err)inner=`<div class="warnbox" style="margin:0">${esc(GATE.err)}</div><button class="btn pri" data-act="gate-retry">Reintentar</button>`;
  else inner=`<form id="gateForm" class="stack" novalidate>
      <div class="field"><label for="g-email">Email</label><input class="in" id="g-email" type="email" autocomplete="username" value="${esc(GATE.email)}" placeholder="tu@email.com" autofocus></div>
      <div class="field"><label for="g-pass">Contraseña${login?'':' (mínimo 6 caracteres)'}</label><div class="pw"><input class="in" id="g-pass" type="password" autocomplete="${login?'current-password':'new-password'}" placeholder="••••••••">${eyeBtn()}</div></div>
      ${GATE.msg?`<div class="${GATE.ok?'okbox':'warnbox'}" style="margin:0">${esc(GATE.msg)}</div>`:''}
      <button class="btn pri gate-go" type="submit" ${GATE.busy?'disabled':''}>${GATE.busy?'Un momento…':login?'Entrar':'Crear cuenta'}</button>
    </form>
    <div class="gate-links">${login?'<button class="btn ghost sm" data-act="gate-forgot">¿Olvidaste la contraseña?</button>':''}<button class="btn ghost sm" data-act="gate-mode">${login?'Crear cuenta nueva':'Ya tengo cuenta'}</button></div>`;
  g.innerHTML=`<div class="gate-card"><div class="brand">${mark}<div class="brand-name" style="color:var(--ink)">Forja</div></div>
    <div><h1 class="title">${login?'Bienvenido':'Crear cuenta'}</h1><p class="note" style="margin:4px 0 0">${login?'Inicia sesión para entrar en tu app de entrenamiento.':'Crea tu cuenta para usar la app y compartir tus retos.'}</p></div>
    ${inner}</div>`;
  if(!GATE.loading&&!GATE.err&&!GATE.busy){const f=GATE.email?$('#g-pass'):$('#g-email');f&&f.focus()}
}
function hideGate(){const g=$('#gate');if(g)g.hidden=true;document.body.classList.remove('gated')}
function renderAcct(){
  const el=$('#acct-side');if(!el)return;
  if(!FB.user||inClaude()){el.innerHTML='';return}
  const name=S.settings.name||'Mi perfil',ini=name.trim().slice(0,1).toUpperCase();
  const cl=SYNC.msg?'Sin sincronizar':SYNC.busy?'Sincronizando…':SYNC.at?'Sincronizado '+new Date(SYNC.at).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'Conectando…';
  el.innerHTML=`<div class="acct-side"><a class="me" href="#perfil" title="Ir a mi perfil"><span class="me-av">${esc(ini)}</span><span class="me-tx"><b>${esc(name)}</b><small><i class="cdot2 ${SYNC.msg?'bad':SYNC.at?'on':''}"></i>${cl}</small></span></a><button class="side-out" data-act="fb-logout" title="Cerrar sesión" aria-label="Cerrar sesión"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg><span>Cerrar sesión</span></button></div>`;
}

/* ---------- render ---------- */
const VIEWS={panel:vPanel,calendario:vCalendario,rutinas:vRutinas,comidas:vComidas,retos:vRetos,progreso:vProgreso,fotos:vFotos,perfil:vPerfil};
function route(){const h=location.hash.slice(1);if(h.startsWith('reto-'))return 'reto';return VIEWS[h]?h:'panel'}
function render(){
  const r=route();
  const nr=r==='reto'?'retos':r;const lk=(k,l,on,sub)=>`<a href="#${k}" class="${on?'on':''} ${sub?'subnav':''}" title="${l}" ${on?'aria-current="page"':''}>${ico(k)}<span>${l}</span></a>`;renderAcct();
  $('#nav').innerHTML=ROUTES.map(([k,l])=>lk(k,l,k===nr,k==='fotos')).join('');$('#tabbar').innerHTML=ROUTES.filter(([k])=>k!=='fotos').map(([k,l])=>lk(k,l,k===nr||(k==='progreso'&&nr==='fotos'))).join('');
  const y=window.scrollY;
  $('#main').innerHTML=r==='reto'?vReto(location.hash.slice(6)):VIEWS[r]();ensureTaskSubs();
  window.scrollTo(0,y);
}
const VIEWER=location.hash.startsWith('#ver=');
window.addEventListener('hashchange',()=>{if(VIEWER)return;if(!location.hash.startsWith('#reto-')){ui.rid=null}render();window.scrollTo(0,0)});
try{if(localStorage.getItem('forja-side')==='mini'){document.body.classList.add('side-mini');const b=$('.side-toggle');b.setAttribute('aria-label','Expandir menú');b.title='Expandir menú'}}catch(e){}
if(VIEWER){viewerBoot(location.hash.slice(5))}
else if(gateActive()){GATE.loading=true;renderGate();
  fbInit(fbCfg(),false).then(()=>{GATE.loading=false;if(FB.uid){hideGate();startApp()}else renderGate()})
    .catch(e=>{GATE.loading=false;GATE.err=e.message||'No se pudo conectar';renderGate()})}
else startApp();
</script>
</body>
</html>
